[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bytewright"
version = "0.1.0"
description = "Sir Yaps-a-Lot — an AI system that turns intent into a working Windows .exe via a verifiable machine-level IR and a deterministic, trusted backend."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sir Yaps-a-Lot project" }]
dependencies = [
    "keystone-engine>=0.9.2",  # asm -> bytes
    "capstone>=5.0",           # bytes -> asm (round-trip verification)
    "unicorn>=2.0",            # CPU emulation (the harness core)
    "lief>=0.14",              # independent PE parsing / structural validation
    "jsonschema>=4.0",         # IR schema validation
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]             # MCP server surface
ai = ["anthropic>=0.40"]      # model-driven generator (bytewright create / chat)
emu-win = ["qiling>=1.4"]     # optional Windows-fidelity emulation path
dev = ["pytest>=7.0"]

[project.scripts]
bytewright = "bytewright.cli:main"

[tool.setuptools.packages.find]
include = ["bytewright*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
